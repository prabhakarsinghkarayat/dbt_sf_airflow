version: 2

sources:
  - name: raw_catalog
    database: CAPSTONE_ECOMMERCE_DB
    schema: RAW_CATALOG
    description: >
      Transaction data
    
    config:
      loaded_at_field: updated_dt
      freshness:
        warn_after:
          count: 60
          period: minute

    tables:
